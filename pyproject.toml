[project]
name = "predhft"
version = "0.1.0"
description = "Maker bot for US-legal prediction markets (Kalshi / Polymarket US). Phase 1: paper only."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "websockets>=12", "cryptography>=42", "pyarrow>=17", "pandas>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predhft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
